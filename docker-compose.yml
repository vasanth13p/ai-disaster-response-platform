services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: respondaid
      POSTGRES_PASSWORD: respondaid
      POSTGRES_DB: respondaid
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres-data:
